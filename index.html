<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProtoWeb · Prefeitura Municipal de Careiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#551A8B">
<meta name="description" content="Acesso restrito. Entre com a sua conta para ver o protocolo.">
<meta property="og:title" content="ProtoWeb">
<meta property="og:site_name" content="Prefeitura Municipal de Careiro">
<meta property="og:description" content="Acesso restrito. Entre com a sua conta para ver o protocolo.">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bar" class="bar" hidden></div>
<div id="app"><div class="boot" style="font:15px system-ui,sans-serif;color:#6b5a64;padding:24px">Carregando ProtoWeb…</div></div>
<div id="toasts" aria-live="polite"></div>
<script>
// Se o sistema não carregar, mostra o motivo em vez de uma página branca.
function pwFail(m){var a=document.getElementById("app");if(a&&a.querySelector(".boot"))a.innerHTML='<div style="font:15px system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:24px;border:1px solid #efdde6;border-radius:8px;background:#fff"><b>Não foi possível carregar o ProtoWeb.</b><p>'+m+'</p><p>Aperte F12 e abra a aba Console para ver o erro completo.</p></div>'}
addEventListener("error",function(e){pwFail("Erro no código: "+(e.message||"arquivo não carregado")+".")});
</script>
<script type="module" src="js/app.js" onerror="pwFail('Um arquivo do sistema não foi encontrado (js/app.js ou um arquivo que ele importa, como js/config.js).')"></script>
</body>
</html>
