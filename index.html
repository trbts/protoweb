<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProtoWeb · Protocolos e tramitação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#e2d9f6">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<!-- PWA: instalação no Android/Chrome/Edge e na Tela de Início do iPad/iPhone -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ProtoWeb">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="icon" href="protoweb.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="protoweb.ico" sizes="any">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bar" class="bar" hidden></div>
<div id="app"><div class="boot" style="font:15px system-ui,sans-serif;color:#6b5a64;padding:24px">Carregando ProtoWeb…</div></div>
<div id="toasts" aria-live="polite"></div>
<script>
// Se o sistema não carregar, mostra o motivo em vez de uma página branca.
function pwFail(m){var a=document.getElementById("app");if(a&&a.querySelector(".boot"))a.innerHTML='<div style="font:15px system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:24px;border:1px solid #efdde6;border-radius:8px;background:#fff"><b>Não foi possível carregar o ProtoWeb.</b><p>'+m+'</p><p>O login usa o Firebase e os dados ficam na nuvem: é preciso ter internet. Aperte F12 e abra a aba Console para ver o erro completo.</p></div>'}
addEventListener("error",function(e){pwFail("Erro no código: "+(e.message||"arquivo não carregado")+".")});
</script>
<script src="pwa.js" defer></script>
<script type="module" src="js/app.js" onerror="pwFail('Um arquivo do sistema não foi encontrado (js/app.js).')"></script>
</body>
</html>
